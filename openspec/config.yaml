context: |
  SaaS chatbot for LATAM clinics. Multi-tenant (FastAPI + PostgreSQL).
  Frontend: React + Vite + Tailwind.
  Integrations: OpenAI GPT-4o-mini, Evolution API (WhatsApp), Google Calendar.
  Deployed on Render free tier.
  Currently: web panel working (register, login, dashboard, appointments, patients, onboarding).
  Missing: WhatsApp bot, AI, Google Calendar, Redis reminders, billing/subscriptions.

strict_tdd: true

testing:
  runner:
    command: "python -m pytest"
    framework: "pytest"
  layers:
    unit: { available: true, tool: "pytest" }
    integration: { available: true, tool: "pytest + httpx AsyncClient" }
    e2e: { available: false, tool: "" }
  coverage:
    available: false
    command: ""
  quality:
    linter: { available: true, command: "ruff" }
    type_checker: { available: false, command: "" }
    formatter: { available: true, command: "ruff format" }

phases:
  proposal:
    prompt_template: "Create a change proposal for {change_name}"
    artifact: proposal
  spec:
    depends_on: proposal
    prompt_template: "Create specs for {change_name}"
    artifact: spec
  design:
    depends_on: proposal
    prompt_template: "Create technical design for {change_name}"
    artifact: design
  tasks:
    depends_on: [spec, design]
    prompt_template: "Break {change_name} into implementation tasks"
    artifact: tasks
  apply:
    depends_on: tasks
    prompt_template: "Implement tasks for {change_name}"
    artifact: apply-progress
  verify:
    depends_on: apply
    prompt_template: "Verify implementation of {change_name}"
    artifact: verify-report
  archive:
    depends_on: verify
    prompt_template: "Archive {change_name}"
    artifact: archive-report

session:
  execution_mode: interactive
  artifact_store: both
  delivery_strategy: ask-always
  review_budget_lines: 400
